name: Add In-App SDK Changer
on: workflow_dispatch
jobs:
  add-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create SDK Feature
        run: |
          mkdir -p app/src/main/java/com/besome/sketch
          
          cat > app/src/main/java/com/besome/sketch/SdkManager.java << 'EOF'
          package com.besome.sketch;
          import android.content.Context;
          import android.content.SharedPreferences;
          public class SdkManager {
              private static final String PREF = "pro_sdk_pref";
              public static void saveSdk(Context c, int compile, int target, int min){
                  c.getSharedPreferences(PREF, Context.MODE_PRIVATE).edit()
                   .putInt("compileSdk", compile)
                   .putInt("targetSdk", target)
                   .putInt("minSdk", min).apply();
              }
              public static int getTargetSdk(Context c){ return c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getInt("targetSdk", 34); }
              public static int getCompileSdk(Context c){ return c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getInt("compileSdk", 34); }
              public static int getMinSdk(Context c){ return c.getSharedPreferences(PREF, Context.MODE_PRIVATE).getInt("minSdk", 21); }
          }
          EOF

          cat > app/src/main/java/com/besome/sketch/SdkSettingsActivity.java << 'EOF'
          package com.besome.sketch;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          public class SdkSettingsActivity extends AppCompatActivity {
              EditText etCompile, etTarget, etMin;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.sdk_settings);
                  etCompile = findViewById(R.id.et_compile);
                  etTarget = findViewById(R.id.et_target);
                  etMin = findViewById(R.id.et_min);
                  Button btnSave = findViewById(R.id.btn_save);
                  etCompile.setText(String.valueOf(SdkManager.getCompileSdk(this)));
                  etTarget.setText(String.valueOf(SdkManager.getTargetSdk(this)));
                  etMin.setText(String.valueOf(SdkManager.getMinSdk(this)));
                  btnSave.setOnClickListener(v -> {
                      try {
                          int c = Integer.parseInt(etCompile.getText().toString());
                          int t = Integer.parseInt(etTarget.getText().toString());
                          int m = Integer.parseInt(etMin.getText().toString());
                          SdkManager.saveSdk(this, c, t, m);
                          Toast.makeText(this, "SDK Saved! Target: " + t, Toast.LENGTH_LONG).show();
                          finish();
                      } catch (Exception e){ Toast.makeText(this, "Enter valid number", Toast.LENGTH_SHORT).show(); }
                  });
              }
          }
          EOF

          cat > app/src/main/res/layout/sdk_settings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="24dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content"
                  android:text="SDK Manager" android:textSize="22sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
              <EditText android:id="@+id/et_compile" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="compileSdk (34)" android:inputType="number"/>
              <EditText android:id="@+id/et_target" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="targetSdk (34)" android:inputType="number" android:layout_marginTop="12dp"/>
              <EditText android:id="@+id/et_min" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="minSdk (21)" android:inputType="number" android:layout_marginTop="12dp"/>
              <Button android:id="@+id/btn_save" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="SAVE SDK" android:layout_marginTop="24dp"/>
          </LinearLayout>
          EOF
          MANIFEST="app/src/main/AndroidManifest.xml"
          if ! grep -q "SdkSettingsActivity" "$MANIFEST"; then
            sed -i '/<activity/a \        <activity android:name=".SdkSettingsActivity" android:exported="false" />' "$MANIFEST"
            echo "Manifest updated"
          fi

      - name: Commit
        run: |
          git config user.name "Sagir Bot"
          git config user.email "bot@proappbuilder.com"
          git add .
          git commit -m "Fixed: Added SDK Changer without Bengali issue" || echo "no changes"
          git push
